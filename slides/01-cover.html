<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Rendering — Cover</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .slide {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 160px;
    gap: 0;
  }

  .kicker {
    font-size: 22px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 36px;
  }

  .title {
    font-family: var(--font-display);
    font-size: 120px; font-weight: 400; line-height: 1;
    color: var(--text-1); margin-bottom: 0;
  }

  .title-accent {
    font-family: var(--font-display);
    font-size: 120px; font-weight: 400; line-height: 1;
    color: var(--accent); margin-bottom: 48px;
  }

  .subtitle {
    font-size: 32px; color: var(--text-2); font-style: italic;
    line-height: 1.5; margin-bottom: 72px;
    max-width: 900px;
  }

  .pills {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
  }

  .pill {
    font-size: 22px; font-weight: 700;
    padding: 10px 28px; border-radius: 999px;
    background: var(--surface2); border: 2px solid var(--border-hi);
    color: var(--text-2);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-header"></div>

  <div class="kicker">Computer Graphics · 2026</div>
  <div class="title">Neural</div>
  <div class="title-accent">Rendering</div>
  <div class="subtitle">Teaching a neural network to see the world —<br>and show it from any angle</div>

  <div class="pills">
    <span class="pill">📷 Photos in</span>
    <span class="pill">🧠 AI learns</span>
    <span class="pill">🎥 Any view out</span>
  </div>

  <div class="slide-num">01 / 10</div>
</div>
</body>
</html>
